[project]
name = "csv-type-inferrer"
version = "0.1.0"
description = "Scans CSV data and reports per-column inferred types such as int, float, date, and boolean."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
